name: Terraform Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init (root)
        run: terraform init -backend=false

      - name: Validate (root)
        run: terraform validate

      - name: Init (docker-test example)
        run: terraform init -backend=false
        working-directory: examples/docker-test

      - name: Validate (docker-test example)
        run: terraform validate
        working-directory: examples/docker-test

  plan:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-north-1
      TF_VAR_allowed_ssh_cidr: ${{ secrets.ALLOWED_SSH_CIDR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Init (with S3 backend)
        run: terraform init -input=false

      - name: Plan (summary only)
        run: |
          set +e
          terraform plan -no-color -input=false > plan.txt 2>&1
          code=$?
          grep -E "^(Plan:|No changes|Error)" plan.txt || true
          exit $code
